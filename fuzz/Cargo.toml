test = false
doc = false
bench = false

[[bin]]
name = "fuzz_audit"
path = "fuzz_targets/fuzz_audit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cdc"
path = "fuzz_targets/fuzz_cdc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_object"
path = "fuzz_targets/fuzz_object.rs"
test = false
