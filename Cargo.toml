[package]
name = "respawn"
version = "0.2.0"
edition = "2021"
description = "Versioned respawn: content-addressed snapshots, atomic revert, drift detection, LAN sync"
license = "LicenseRef-Proprietary"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/respawn"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
notify = "6.1"
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
filetime = "0.2"

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "fabric_bench"
harness = false
