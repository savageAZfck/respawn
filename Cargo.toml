[package]
name = "state_fabric"
version = "0.1.0"
edition = "2021"
description = "Versioned state fabric: content-addressed snapshots, atomic revert, drift detection, LAN sync"
license = "LicenseRef-Proprietary"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/state_fabric"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
notify = "6.1"
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "fabric_bench"
harness = false
